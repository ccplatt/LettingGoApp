<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letting Go - Emotion Clusters</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero__diagonal"></div>
      <div class="hero__content">
        <h1>Letting Go</h1>
        <p class="subtitle">Choose an emotional state to explore</p>
      </div>
    </header>

    <main class="clusters" id="clusters"></main>
  </div>

  <template id="cluster-template">
    <article class="cluster" data-color="">
      <button class="cluster__bubble" type="button">
        <span class="cluster__label"></span>
      </button>
      <div class="cluster__sub">
        <p class="cluster__heading"></p>
        <div class="cluster__cloud"></div>
      </div>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
